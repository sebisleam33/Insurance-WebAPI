image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - build
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"
  REPORTGENERATOR_DIR: "C:\\tools\\reportgenerator"
  GIT_STRATEGY: fetch
  GIT_CLEAN_FLAGS: none

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/packages/

build:
  stage: build
  script:
    - dotnet --info
    - dotnet restore
    - dotnet build -c Release --no-restore

test:
  stage: test
  script:
    - |
      dotnet test -c Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      $rgVersion = "5.5.1"
      $rgDir = "$PWD\.tools\reportgenerator"
      $rgNupkg = "$rgDir\reportgenerator.$rgVersion.nupkg"

      New-Item -ItemType Directory -Force $rgDir | Out-Null

      if (-not (Test-Path $rgNupkg)) {
        dotnet nuget locals all --clear
        dotnet nuget add source "https://api.nuget.org/v3/index.json" -n nuget-org -p 1>$null 2>$null
        Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/dotnet-reportgenerator-globaltool/$rgVersion" -OutFile $rgNupkg
      }

      Add-Type -AssemblyName System.IO.Compression.FileSystem
      $extractDir = "$rgDir\extracted"
      if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
      [System.IO.Compression.ZipFile]::ExtractToDirectory($rgNupkg, $extractDir)

      $rgExe = Get-ChildItem -Recurse -Filter "reportgenerator.exe" $extractDir |
        Where-Object { $_.FullName -match "\\tools\\net8\.0\\any\\" } |
        Select-Object -First 1

      if (-not $rgExe) { throw "reportgenerator.exe not found in extracted package." }

      & $rgExe.FullName `
        "-reports:**/TestResults/**/coverage.cobertura.xml" `
        "-targetdir:CoverageReport" `
        "-reporttypes:Html;Cobertura"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "**/TestResults/"
      - "CoverageReport/"
    reports:
      junit: "**/TestResults/**/test-results.trx"
      coverage_report:
        coverage_format: cobertura
        path: CoverageReport/Cobertura.xml

