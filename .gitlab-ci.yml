image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - restore
  - build
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/packages/

restore:
  stage: restore
  script:
    - dotnet --info
    - dotnet restore
  artifacts:
    expire_in: 1 day
    paths:
      - .nuget/packages/

build:
  stage: build
  script:
    - dotnet build -c Release --no-restore

test:
  stage: test
  script:
    - dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

    - dotnet tool install --tool-path . dotnet-reportgenerator-globaltool
    - ./reportgenerator "-reports:**/TestResults/**/coverage.cobertura.xml" "-targetdir:CoverageReport" "-reporttypes:Html;Cobertura"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "**/TestResults/"
      - "CoverageReport/"
    reports:
      junit: "**/TestResults/**/test-results.trx"
      coverage_report:
        coverage_format: cobertura
        path: CoverageReport/Cobertura.xml
