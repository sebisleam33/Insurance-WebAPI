image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - build
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"
  REPORTGENERATOR_DIR: "C:\\tools\\reportgenerator"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/packages/

build:
  stage: build
  script:
    - dotnet --info
    - dotnet restore
    - dotnet build -c Release --no-restore

test:
  stage: test
  script:
    - |
      dotnet test -c Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      if (-not (Test-Path $env:REPORTGENERATOR_DIR)) {
        New-Item -ItemType Directory -Force $env:REPORTGENERATOR_DIR | Out-Null
      }

      if (-not (Test-Path "$env:REPORTGENERATOR_DIR\reportgenerator.exe")) {
        dotnet tool install --tool-path $env:REPORTGENERATOR_DIR dotnet-reportgenerator-globaltool
      }

      & "$env:REPORTGENERATOR_DIR\reportgenerator.exe" `
        "-reports:**/TestResults/**/coverage.cobertura.xml" `
        "-targetdir:CoverageReport" `
        "-reporttypes:Html;Cobertura"

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "**/TestResults/"
      - "CoverageReport/"
    reports:
      junit: "**/TestResults/**/test-results.trx"
      coverage_report:
        coverage_format: cobertura
        path: CoverageReport/Cobertura.xml
