image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - build
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"
  GIT_STRATEGY: fetch
  GIT_CLEAN_FLAGS: none

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/packages/

build:
  stage: build
  script:
    - dotnet --info
    - dotnet restore
    - dotnet build -c Release --no-restore

test:
  stage: test
  script:
    - dotnet test -c Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"
    - dotnet tool install --tool-path ./.tools dotnet-reportgenerator-globaltool --version 5.5.1
    - ./.tools/reportgenerator "-reports:**/TestResults/**/coverage.cobertura.xml" "-targetdir:CoverageReport" "-reporttypes:Html;Cobertura"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "**/TestResults/"
      - "CoverageReport/"
    reports:
      junit: "**/TestResults/**/test-results.trx"
      coverage_report:
        coverage_format: cobertura
        path: "CoverageReport/Cobertura.xml"
